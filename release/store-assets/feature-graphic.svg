<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Background -->
  <rect width="1024" height="500" fill="#0D1B2A"/>
  
  <!-- Subtle pattern overlay -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B2A;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#grad)"/>
  
  <!-- Snooker Table (left side) -->
  <rect x="60" y="120" width="380" height="260" rx="10" fill="#2D7D46" stroke="#5C3A1E" stroke-width="8"/>
  
  <!-- Table pockets -->
  <circle cx="80" cy="140" r="18" fill="#111"/>
  <circle cx="420" cy="140" r="18" fill="#111"/>
  <circle cx="80" cy="360" r="18" fill="#111"/>
  <circle cx="420" cy="360" r="18" fill="#111"/>
  <ellipse cx="60" cy="250" rx="12" ry="16" fill="#111"/>
  <ellipse cx="440" cy="250" rx="12" ry="16" fill="#111"/>
  
  <!-- Red balls cluster -->
  <circle cx="300" cy="200" r="12" fill="#DC143C"/>
  <circle cx="300" cy="230" r="12" fill="#DC143C"/>
  <circle cx="320" cy="215" r="12" fill="#DC143C"/>
  <circle cx="280" cy="215" r="12" fill="#DC143C"/>
  <circle cx="300" cy="260" r="12" fill="#DC143C"/>
  <circle cx="320" cy="245" r="12" fill="#DC143C"/>
  <circle cx="280" cy="245" r="12" fill="#DC143C"/>
  <circle cx="280" cy="275" r="12" fill="#DC143C"/>
  
  <!-- Color balls -->
  <circle cx="160" cy="185" r="10" fill="#FFD700"/>
  <circle cx="160" cy="285" r="10" fill="#228B22"/>
  <circle cx="160" cy="315" r="10" fill="#8B4513"/>
  <circle cx="160" cy="210" r="10" fill="#1E90FF"/>
  <circle cx="160" cy="255" r="10" fill="#FF69B4"/>
  <circle cx="160" cy="240" r="10" fill="#333"/>
  
  <!-- Cue ball -->
  <circle cx="220" cy="330" r="12" fill="#EEE" stroke="#CCC" stroke-width="1"/>
  
  <!-- Cue stick -->
  <line x1="370" y1="420" x2="205" y2="330" stroke="#D4A574" stroke-width="8" stroke-linecap="round"/>
  <line x1="370" y1="420" x2="210" y2="333" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-dasharray="4,20"/>
  
  <!-- Title Text -->
  <text x="520" y="220" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="bold" fill="#FFD700">SNOOKER</text>
  <text x="520" y="280" font-family="Helvetica, Arial, sans-serif" font-size="36" font-weight="normal" fill="#AAA">Scorekeeper</text>
  
  <!-- Description -->
  <text x="520" y="330" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#888">
    <tspan x="520" dy="0">Track your snooker matches with ease.</tspan>
    <tspan x="520" dy="28">Simple, fast, and fully offline.</tspan>
  </text>
  
  <!-- Decorative dots -->
  <circle cx="520" cy="400" r="4" fill="#FFD700" opacity="0.5"/>
  <circle cx="540" cy="400" r="4" fill="#DC143C" opacity="0.5"/>
  <circle cx="560" cy="400" r="4" fill="#228B22" opacity="0.5"/>
  <circle cx="580" cy="400" r="4" fill="#1E90FF" opacity="0.5"/>
  <circle cx="600" cy="400" r="4" fill="#FF69B4" opacity="0.5"/>
  <circle cx="620" cy="400" r="4" fill="#333" opacity="0.5"/>
</svg>
